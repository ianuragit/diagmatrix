# Typos / fused tokens fixed in names before anything else (regex → replacement).
text_fixes:
  - ['\bEDANi15\b', 'EDAN i15']
  - ['\bBinaxNOWG6PD\b', 'BinaxNOW G6PD']
  - ['\bPragnancy\b', 'Pregnancy']
  - ['\bThermoFisher\b', 'Thermo Fisher']
  - ['\bTestTest\b', 'Test']
  - ['\bfaciparum\b', 'falciparum']
  - ['\bNasopharayngeal\b', 'Nasopharyngeal']
  - ['\b(\d+) l\b', '$1 µl']
  - ['\s+\.$', '']
  - ['\.$', '']
  - ['\bHIV 1-2\.O\b', 'HIV 1-2.0']
  - ['\b[Cc][Oo][Vv][Ii][Dd]\s*-\s*19\b', 'COVID-19']

# Scope: diagnostics only (decision 2026-11-25). Records are dropped in build-data
# if their source category is listed here, or — in any category — if their name
# matches an exclude keyword and no diagnostic keyword. Dropped records are listed
# in the report, never silently lost.
