    aliases: [Abbott Diagnostics, Alere, ABBOTT, Abaxis]
    lines: [Bioline, Determine, Panbio, BinaxNOW, i-STAT, Afinion, ID NOW, ABON, SureStep, TestPack, CheckNOW, NxTek, Realtime, Cholestech, Piccolo]
