# Shared taxonomy. Every source maps onto these ids — no parallel category trees.
# Matching (normalise/classify.ts) is case-insensitive on word boundaries.
# Structured source values (e.g. a source's "Parameter"/"Methode"/"Probentyp") are
# matched against the same keyword lists, so German and English synonyms live here.

# ---------------------------------------------------------------------------
# Categories: derived from technology (each technology names its category).
# Subcategory = product type (instruments / tests & reagents / controls … / consumables).
# ---------------------------------------------------------------------------
categories:
  rapid-tests: { label: Rapid tests, intro: "Rapid tests are single-use lateral-flow or similar devices that give a visual or reader-based result in minutes, usually at the point of care." }
  immunoassays: { label: Immunoassays, intro: "Immunoassays detect or measure analytes using antibody–antigen binding, in formats such as ELISA, chemiluminescence (CLIA) and fluorescence (FIA)." }
  molecular: { label: Molecular diagnostics, intro: "Molecular tests detect pathogen or human nucleic acids, typically by PCR or isothermal amplification such as LAMP." }
  clinical-chemistry: { label: Clinical chemistry, intro: "Clinical chemistry systems measure metabolites, enzymes, electrolytes and proteins in blood or other body fluids." }
  hematology: { label: Hematology, intro: "Hematology analysers count and classify blood cells (complete blood count, 3-part or 5-part differential)." }
  coagulation: { label: Coagulation, intro: "Coagulation tests measure how quickly blood clots, for example PT/INR for monitoring anticoagulant therapy." }
  blood-gas: { label: Blood gas & electrolytes, intro: "Blood gas analysers measure pH, pO2, pCO2 and often electrolytes, metabolites and co-oximetry from whole blood." }
  urinalysis: { label: Urinalysis, intro: "Urinalysis covers urine test strips, strip readers and urine sediment analysers." }
  diabetes: { label: Glucose & diabetes, intro: "Diabetes testing covers blood glucose, HbA1c and ketone measurement, from meters to point-of-care analysers." }
  microbiology: { label: Microbiology & culture, intro: "Microbiology products culture or identify microorganisms and test their antibiotic susceptibility." }
  general: { label: General diagnostics, intro: "Diagnostic products that do not fit a more specific technology group." }

subcategories:
  instrument: Instruments
  reagent: Tests & reagents
  control: Controls & calibrators
  consumable: Consumables

