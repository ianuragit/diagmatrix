# Shared taxonomy. Every source maps onto these — no parallel category trees.
# Keyword lists drive normalise/classify.ts (Phase 4); matching is case-insensitive
# on whole words over name + category + specs. Expanded in Phase 4.
categories:
  - id: rapid-tests
    label: Rapid diagnostic tests
    source_labels: { src-a: [Medical RTD, Medical RDT], src-b: [] }
  - id: elisa
    label: ELISA kits
    source_labels: { src-a: [Medical ELISA], src-b: [] }
  - id: poct
    label: Point-of-care testing
    source_labels: { src-a: [Medical POCT], src-b: [] }
  - id: fia
    label: Fluorescence immunoassay
    source_labels: { src-a: [Medical FIA], src-b: [] }
  - id: ivd
    label: In-vitro diagnostics (general)
    source_labels: { src-a: [Medical IVD], src-b: [] }
  - id: clia
    label: Chemiluminescence immunoassay (CLIA)
    source_labels: { src-a: [Medical CLIA], src-b: [] }
  - id: analyzers
    label: Diagnostic analyzers
    source_labels: { src-a: [Medical Analyzer], src-b: [] }
  - id: reagents
    label: Diagnostic reagents
    source_labels: { src-a: [Medical Reagents], src-b: [] }
  - id: consumables
    label: Diagnostic consumables
    source_labels: { src-a: [Medical Consumables], src-b: [] }

# Scope: diagnostics only (decision 2026-11-25). Records are dropped in build-data
# (Phase 4) if their source category is listed here, or — in any category — if
# their name matches an exclude keyword and no diagnostic keyword. Dropped records
# are listed in the report, never silently lost.
scope:
  exclude_source_categories:
    src-a: [Medical LAB, Medical Accesories, Medical Surgicals, Life Sciences]
    src-b: []
  exclude_keywords: [guidewire, catheter, stent, suture, closure system, pacing, implant, surgical,
    spectrometer, chromatograph, titrator, moisture analyzer, balance, autosampler, centrifuge,
    incubator shaker, fume hood, biosafety cabinet, pipette controller]
  diagnostic_keywords: [test, assay, elisa, clia, rapid, kit, reagent, control, calibrator, analyzer,
    analyser, cartridge, strip, ivd, diagnostic, pcr, antigen, antibody, igg, igm]

technology:
  rdt: { label: Rapid test (lateral flow), keywords: [rapid test, rapid, cassette, card test, strip test, lateral flow, rdt] }
  elisa: { label: ELISA, keywords: [elisa, eia] }
  fia: { label: Fluorescence immunoassay, keywords: [fia, ichroma, afias, finecare, fluorescence] }
  pcr: { label: PCR, keywords: [pcr, rt-pcr, qpcr, real-time pcr] }
  blood-gas: { label: Blood gas, keywords: [blood gas, i15, i-stat, epoc] }
  urinalysis: { label: Urinalysis, keywords: [urine strip, urinalysis, urine analyzer] }
  glucometry: { label: Glucometry, keywords: [glucometer, glucose meter, glucose strips] }

analytes: {}       # filled in Phase 4, e.g. hiv: { label: HIV, keywords: [hiv, hiv 1/2] }
sample_types: {}   # e.g. whole-blood: { label: Whole blood, keywords: [whole blood, wb] }
product_types:
  instrument: [analyzer, analyser, reader, meter, instrument, device]
  consumable: [cartridge, lancet, cuvette, tip, tube, swab]
  reagent: [kit, test, reagent, control, calibrator, strip]
subtypes:
  control: [control]
  calibrator: [calibrator]
  cartridge: [cartridge]
