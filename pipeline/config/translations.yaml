# German → English for everything shown on the site (the site is English-only).
# Applied in build-data AFTER classification, to: product names, public spec
# values and document titles. Classification still matches the original text.
#
#   names    – full-name overrides, used when word order changes ("PSA gesamt" → "Total PSA")
#   values   – full-value overrides for whole sentences
#   terms    – exact items of comma-separated lists (e.g. an analyte list), case-insensitive
#   phrases  – word/phrase replacements inside free text, longest first, case-insensitive
#   allow    – proper nouns that may keep non-English letters (brand and person names)
#   markers  – words that betray untranslated German; `pnpm validate` fails if any remain
#
# US spelling throughout (hemoglobin, hematocrit, ionized), matching the rest of the site.

