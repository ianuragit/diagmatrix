# Canonical brands. Matching (normalise/brand.ts). `stated_only: true` marks brand
# names that are ordinary words (never matched from a product name).
#
#   1. longest-prefix match of the name against canonical names + aliases,
#   2. else a product line at the start of the (remaining) name,
#   3. else the brand the source states (mapped through aliases; unknown stated
#      brands pass through with tidied casing and are listed in the report).
# Name-derived brands beat stated ones; disagreements are reported, never hidden.
# The matched brand text is stripped from `name`; the line stays in the name and
# is also stored as `product_line`.
brands:
